# Publishes the documentation site to GitHub Pages on every push to main that
# touches what the site is built from.
#
# Setup once: Settings -> Pages -> Source: "GitHub Actions". Without that the
# deploy step fails with "Pages site not found" however green the build looks.
name: Pages
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "scripts/build-site.mts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let a newer commit win: a queued run would only
# publish content that is already out of date.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
