# Publishes the documentation site to GitHub Pages on every push to main that
# touches what the site is built from.
#
# Setup once: Settings -> Pages -> Source: "GitHub Actions". Without that the
# deploy step fails with "Pages site not found" however green the build looks.
name: Pages
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "CLAUDE.md"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  # contents: write so the sync step can commit corrected URLs back.
  contents: write
  pages: write
  id-token: write

# One deploy at a time, and let a newer commit win: a queued run would only
# publish content that is already out of date.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Ask Pages where this repository actually publishes, rather than
      # trusting a URL somebody typed into the manifest.
      - id: pages
        uses: actions/configure-pages@v5

      # Markdown cannot read a constant, so rewrite the literal URLs in the
      # README and docs to wherever this repository now lives. A fork, a
      # transfer or a rename corrects its own links instead of advertising the
      # original repository.
      - name: Point the docs at this repository
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run sync:site-url

      - name: Commit the corrected URLs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "URLs already correct; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Point the documentation at ${SITE_URL}"
          # This push lands on the same paths this workflow watches, so it
          # triggers one more run. That run finds nothing to change and stops,
          # so it settles after a single extra pass.
          git push

      - name: Build the site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build:site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
